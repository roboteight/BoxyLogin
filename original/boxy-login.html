<div id="wrapper">

    <div id="boxy-login-wrapper">

        <form name="boxy-login-form">

            <fieldset>
                <div class="boxy-form-inner" data-boxy-rotate="rotateFirst3d">

                    <div class="end-cap left" data-boxy-step="0">
                        <button class="boxy-button begin-login">
                            <i class="mx-auto" data-feather="user" data-toggle="tooltip" title="click to login"></i>
                        </button>
                    </div>

                    <div class="side front" data-boxy-step="1">
                        <i data-feather="user" data-toggle="tooltip" class="boxy-icon-inline" title="enter your username"></i>
                        <label for="boxy-username">
                            <input id="boxy-username" name="username" class="boxy-input rotate" placeholder="username"
                                   required autocomplete="off"/>
                        </label>
                        <button class="boxy-button next-field"><i data-feather="arrow-right-circle"></i></button>
                    </div>

                    <div class="side bottom" data-boxy-step="2">
                        <i data-feather="lock" data-toggle="tooltip" class="boxy-icon-inline" title="enter your password"></i>
                        <label for="boxy-password">
                            <input id="boxy-password" type="password" name="password" class="boxy-input rotate"
                                   placeholder="password" required autocomplete="off"/>
                        </label>
                        <button class="boxy-button next-field sub"><i data-feather="arrow-right-circle"></i></button>
                    </div>

                    <div class="side back" data-boxy-step="3">
                        <i class="boxy-icon-inline boxy-checked" data-feather="check-circle"></i>
                        <i class="boxy-icon-inline boxy-unchecked" data-feather="circle"></i>
                        <label for="remember-me">
                            <input id="remember-me" type="checkbox" name="remember-me"/>remember me next time?
                        </label>
                        <button class="boxy-button boxy-final-button"><i data-feather="log-in"></i></button>
                    </div>

                    <div class="side top" data-boxy-step="4">
                        <i data-feather="help-circle" data-toggle="tooltip" title="we'll email login details."></i>
                        <label for="boxy-email" class="d-block">
                            <input id="boxy-email" type="email" name="email" class="rotate" placeholder="email"/>
                        </label>
                        <button class="boxy-button next-field forgot-btn" ></button>
                    </div>

                    <div class="end-cap right" data-boxy-step="5">
                        <button class="boxy-button begin-login" >
                            <i class="icon-success mx-auto" data-feather="user" data-toggle="tooltip"
                               title="click to login"></i>
                            <i class="icon-failure mx-auto" data-feather="x-circle" data-toggle="tooltip"
                               title="login failed, try again"></i>
                        </button>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</div>
